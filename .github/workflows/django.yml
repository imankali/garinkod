name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # The Django suite: every app's unit, integration and regression tests.
  #
  # It runs from `garinkood/`, where `manage.py` and `requirements.txt` live —
  # the previous version of this file installed from the repository root, where
  # there is no requirements file, and pinned Python 3.7–3.9, which the pinned
  # Django does not support. The suite is what the repo already relies on; this
  # only makes it actually run.
  django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garinkood
    env:
      DB_ENGINE: sqlite
      DJANGO_SETTINGS_MODULE: garinkood.settings
      SECRET_KEY: ci-only-secret-key
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: garinkood/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Check migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --verbosity 2

  # The SPA: types, lint, component tests and the production build.
  #
  # Each of these catches a class of break the Django suite cannot see — a
  # renamed serializer field, a card that lost its accessible name, a page that
  # no longer compiles at all — and the build is the last thing before a deploy.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  # End-to-end journeys: the browser against the built bundle and a real API.
  #
  # The unit and component tests can say a card renders and a request carries the
  # right params; only a browser can say the page a seller actually lands on is
  # the one that lists their stall. Playwright starts `vite preview` itself, so
  # this job only has to put Django behind it — same-origin /api is already
  # configured in the preview proxy.
  #
  # DEBUG is on for the same reason it is on in development: the HTTPS hardened
  # block in settings would 301 every request the test browser makes over http,
  # and the rate limits are loosened because a suite of a hundred page loads is
  # indistinguishable from an abuser to a 120/hour anonymous budget.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_ENGINE: sqlite
      DJANGO_SETTINGS_MODULE: garinkood.settings
      SECRET_KEY: ci-only-secret-key
      DEBUG: "True"
      THROTTLE_ANON: 100000/hour
      THROTTLE_USER: 100000/hour
      THROTTLE_LOGIN: 100000/hour
      THROTTLE_REGISTER: 100000/hour
      THROTTLE_CHECKOUT: 100000/hour
      THROTTLE_UPLOAD: 100000/hour
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garinkood/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r garinkood/requirements.txt

      - name: Prepare the demo database
        working-directory: garinkood
        run: |
          python manage.py migrate --noinput
          python manage.py seed_locations
          python manage.py seed_test_catalog
          python manage.py seed_demo_marketplace

      - name: Start the API
        working-directory: garinkood
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/api/categories/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "the API did not come up:"; cat /tmp/api.log; exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the journey suite
        working-directory: frontend
        run: npx playwright test --project=desktop-chromium

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 5
