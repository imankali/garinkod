<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f8a5f" />
    <meta name="author" content="گرین کود" />

    <!--
      Everything below this point that describes *this route* — description,
      robots, canonical, the og:/twitter: title/description/url — is owned by
      `src/components/RouteSeo.tsx` and must not be repeated here.

      react-helmet-async only de-duplicates tags it added itself, so a hardcoded
      tag survives alongside the one the app appends. That is what produced two
      `<meta name="robots">` on every page, and the pair disagreed: this file
      said `index,follow` while RouteSeo said `noindex,nofollow` for /orders,
      /profile, /checkout and the rest of the account routes. A crawler that
      reads both is being told to index a page the site means to keep private,
      and Playwright's strict mode caught the duplication before a crawler did.

      The tags that stay are the ones no route ever varies: the charset, the
      viewport, the theme colour, the author, the locale and site name, and the
      two share images. `<title>` stays too — Helmet rewrites `document.title`
      in place rather than appending a second element, and it is what a
      JavaScript-less scraper sees.
    -->

    <meta property="og:locale" content="fa_IR" />
    <meta property="og:site_name" content="گرین کود" />
    <meta property="og:image" content="https://garinkood.ir/images/hero-farm.jpg" />
    <meta name="twitter:image" content="https://garinkood.ir/images/hero-farm.jpg" />

    <link rel="preconnect" href="https://cdn.fontcdn.ir" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazirmatn/Vazirmatn.css" rel="stylesheet" />

    <title>گرین کود | فروشگاه تخصصی نهاده‌های کشاورزی</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://garinkood.ir/#organization",
            "name": "گرین کود",
            "url": "https://garinkood.ir/",
            "logo": "https://garinkood.ir/favicon.svg"
          },
          {
            "@type": "WebSite",
            "@id": "https://garinkood.ir/#website",
            "url": "https://garinkood.ir/",
            "name": "گرین کود",
            "inLanguage": "fa-IR",
            "publisher": { "@id": "https://garinkood.ir/#organization" }
          },
          {
            "@type": "FAQPage",
            "@id": "https://garinkood.ir/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "گرین کود چه خدماتی ارائه می‌دهد؟",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "گرین کود کاتالوگ نهاده‌های کشاورزی، ثبت سفارش، درخواست خدمات مزرعه، معرفی محصول کشاورزان و بازار غرفه‌های بررسی‌شده را ارائه می‌دهد."
                }
              },
              {
                "@type": "Question",
                "name": "آیا همه روش‌های پرداخت در سایت فعال هستند؟",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "خیر. فقط روش پرداختی که سرور آن را پس از پیکربندی و تأیید فعال نشان دهد قابل استفاده است. روش‌های غیرفعال نباید برای دریافت وجه استفاده شوند."
                }
              },
              {
                "@type": "Question",
                "name": "چگونه از غرفه فروشنده شکایت کنم؟",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "از صفحه آگهی یا بخش پشتیبانی، شکایت را برای غرفه مشخص ثبت کنید تا در صف رسیدگی قرار بگیرد."
                }
              }
            ]
          }
        ]
      }
    </script>

    <style>
      html { background: #f7f3e8; }
      html.dark { background: #052e22; }
      #root-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f7f3e8; z-index: 9999; transition: opacity 0.3s ease; }
      html.dark #root-loader { background: #052e22; }
      .loader-spinner { width: 48px; height: 48px; border: 4px solid #10b981; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* Hidden, not just faded: an element that only lost its opacity is still
         in the tree, still announced, and still the thing a screen reader lands on
         after the page it describes is long gone. */
      .loaded #root-loader { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s ease, visibility 0s linear 0.3s; }
    </style>
  </head>

  <body>
    <div id="root-loader" role="status" aria-live="polite" aria-label="در حال بارگذاری"><div class="loader-spinner"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() { document.documentElement.classList.add('loaded'); }, 100);
      });
    </script>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: Vazirmatn, sans-serif;">
        <h1 style="color: #0f8a5f;">گرین کود</h1>
        <p>برای مشاهده محصولات و ثبت سفارش، لطفاً JavaScript را فعال کنید.</p>
      </div>
    </noscript>
  </body>
</html>
