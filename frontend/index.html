<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f8a5f" />
    <meta name="description" content="گرین کود - فروشگاه تخصصی نهاده‌های کشاورزی" />

    <link rel="preconnect" href="https://cdn.fontcdn.ir" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazirmatn/Vazirmatn.css" rel="stylesheet" />

    <title>گرین کود | فروشگاه تخصصی نهاده‌های کشاورزی</title>

    <style>
      html { background: #f7f3e8; }
      html.dark { background: #052e22; }

      #root-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f3e8;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      html.dark #root-loader { background: #052e22; }

      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #10b981;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .loaded #root-loader { opacity: 0; pointer-events: none; }
    </style>
  </head>

  <body>
    <div id="root-loader">
      <div class="loader-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.documentElement.classList.add('loaded');
        }, 100);
      });
    </script>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: Vazirmatn, sans-serif;">
        <h1 style="color: #0f8a5f;">گرین کود</h1>
        <p>برای استفاده از این سایت، لطفاً JavaScript را فعال کنید.</p>
      </div>
    </noscript>
  </body>
</html>
