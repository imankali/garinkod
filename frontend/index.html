<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <meta name="author" content="گرین کود" />

    <!--
      Everything that describes *this route* — its title, its description, its
      robots directive — is owned by the app: `useTitle` sets the document title
      and the API serves each page's own copy. Do not add per-route meta tags
      here.

      The tags that stay are the ones no route ever varies: the charset, the
      viewport, the theme colour, the author, the locale and site name, and the
      two share images. `<title>` stays too — it is what a JavaScript-less
      scraper sees, and React rewrites the element in place rather than
      appending a second one.
    -->

    <meta property="og:locale" content="fa_IR" />
    <meta property="og:site_name" content="گرین کود" />
    <meta property="og:image" content="https://garinkood.ir/images/hero-farm.jpg" />
    <meta name="twitter:image" content="https://garinkood.ir/images/hero-farm.jpg" />

    <link rel="preconnect" href="https://cdn.fontcdn.ir" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazirmatn/Vazirmatn.css" rel="stylesheet" />

    <title>گرین کود | فروشگاه تخصصی نهاده‌های کشاورزی</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://garinkood.ir/#organization",
            "name": "گرین کود",
            "url": "https://garinkood.ir/",
            "logo": "https://garinkood.ir/favicon.svg"
          },
          {
            "@type": "WebSite",
            "@id": "https://garinkood.ir/#website",
            "url": "https://garinkood.ir/",
            "name": "گرین کود",
            "inLanguage": "fa-IR",
            "publisher": { "@id": "https://garinkood.ir/#organization" }
          },
          {
            "@type": "FAQPage",
            "@id": "https://garinkood.ir/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "گرین کود چه خدماتی ارائه می‌دهد؟",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "گرین کود کاتالوگ نهاده‌های کشاورزی، ثبت سفارش، درخواست خدمات مزرعه، معرفی محصول کشاورزان و بازار غرفه‌های بررسی‌شده را ارائه می‌دهد."
                }
              },
              {
                "@type": "Question",
                "name": "آیا همه روش‌های پرداخت در سایت فعال هستند؟",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "خیر. فقط روش پرداختی که سرور آن را پس از پیکربندی و تأیید فعال نشان دهد قابل استفاده است. روش‌های غیرفعال نباید برای دریافت وجه استفاده شوند."
                }
              },
              {
                "@type": "Question",
                "name": "چگونه از غرفه فروشنده شکایت کنم؟",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "از صفحه آگهی یا بخش پشتیبانی، شکایت را برای غرفه مشخص ثبت کنید تا در صف رسیدگی قرار بگیرد."
                }
              }
            ]
          }
        ]
      }
    </script>

    <style>
      /*
        The first paint, before any CSS module has loaded: the same cream the app
        uses (--color-cream #f6f8f3), the same night surface in dark mode, and one
        spinner. The loader is removed by the app once React has mounted, and it is
        hidden with visibility rather than opacity so a screen reader cannot still
        land on a status message for a page that finished loading.
      */
      html { background: #f6f8f3; }
      html.dark { background: #0d1f17; }
      #root-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f6f8f3; z-index: 9999; transition: opacity 0.3s cubic-bezier(0.23, 1, 0.32, 1); }
      html.dark #root-loader { background: #0d1f17; }
      .loader-spinner { width: 40px; height: 40px; border: 3px solid #bbf7d0; border-top-color: #15803d; border-radius: 50%; animation: spin 0.7s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .loader-spinner { animation-duration: 2s; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loaded #root-loader { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 0.3s; }
    </style>
  </head>

  <body>
    <div id="root-loader" role="status" aria-live="polite" aria-label="در حال بارگذاری"><div class="loader-spinner"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() { document.documentElement.classList.add('loaded'); }, 100);
      });
    </script>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: Vazirmatn, sans-serif;">
        <h1 style="color: #15803d;">گرین‌کود</h1>
        <p>برای مشاهده محصولات و ثبت سفارش، لطفاً JavaScript را فعال کنید.</p>
      </div>
    </noscript>
  </body>
</html>
