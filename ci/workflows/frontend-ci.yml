name: Frontend CI

on:
  push:
    branches: ["master", "arena/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Types, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    # One runner executes all six Playwright projects. This avoids paying six
    # times for dependency installation, database seeding and browser downloads.
    name: Cross-browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: garinkood
          POSTGRES_USER: garinkood
          POSTGRES_PASSWORD: garinkood
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "True"
      DB_ENGINE: postgresql
      DB_NAME: garinkood
      DB_USER: garinkood
      DB_PASSWORD: garinkood
      DB_HOST: localhost
      DB_PORT: "5432"
      # Browsers hammer the API during a run; the default budgets would trip.
      THROTTLE_ANON: 100000/hour
      THROTTLE_USER: 100000/hour
      THROTTLE_LOGIN: 10000/min
      THROTTLE_REGISTER: 10000/hour
      THROTTLE_SEARCH: 10000/min
      THROTTLE_CHECKOUT: 10000/hour

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garinkood/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: garinkood
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare database and demo data
        working-directory: garinkood
        run: |
          python manage.py migrate
          python manage.py seed_locations
          python manage.py seed_agri_inputs
          python manage.py bootstrap_management_roles
          python manage.py seed_demo_marketplace
          # A level-3 account so the moderation specs have somewhere to sign in.
          python manage.py shell -c "
          from django.contrib.auth.models import User
          from shop.models import UserAccount
          user, _ = User.objects.get_or_create(username='e2e-moderator', defaults={'is_staff': True})
          user.set_password('E2eModerator!234'); user.is_staff = True; user.save()
          account, _ = UserAccount.objects.get_or_create(user=user, defaults={'phone': ''})
          account.level = UserAccount.LEVEL_MODERATOR; account.save()
          "


      - name: Start the API
        working-directory: garinkood
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload &
          # Wait for the API before letting the browser suite start.
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/products/ >/dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not start in time"; exit 1

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps

      - name: Build the frontend
        run: npm run build

      - name: Run end-to-end tests
        run: npx playwright test
        env:
          E2E_MODERATOR_USERNAME: e2e-moderator
          E2E_MODERATOR_PASSWORD: E2eModerator!234

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse (performance, a11y, SEO)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.json

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report
          retention-days: 14
          if-no-files-found: ignore
