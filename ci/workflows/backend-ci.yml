name: Backend CI

on:
  push:
    branches: ["master", "arena/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: garinkood

jobs:
  test:
    name: Tests (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.7-3.9 are end of life and cannot run Django 5.2; the project
        # targets the versions listed in requirements.txt.
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: garinkood_test
          POSTGRES_USER: garinkood
          POSTGRES_PASSWORD: garinkood
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            garinkood/requirements.txt
            garinkood/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: System checks
        run: python manage.py check
        env:
          DEBUG: "True"
          DB_ENGINE: sqlite

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
        env:
          DEBUG: "True"
          DB_ENGINE: sqlite

      - name: Validate OpenAPI contract
        run: python manage.py spectacular --validate --file /tmp/openapi.yml
        env:
          DEBUG: "True"
          DB_ENGINE: sqlite

      - name: Tests on SQLite with coverage
        run: |
          coverage run manage.py test shop -v2
          coverage report
          coverage xml
        env:
          DEBUG: "True"
          DB_ENGINE: sqlite

      # PostgreSQL is what production runs, so the suite must pass there too —
      # row locking and constraint behaviour differ from SQLite.
      - name: Tests on PostgreSQL
        run: python manage.py test shop -v2
        env:
          DEBUG: "True"
          DB_ENGINE: postgresql
          DB_NAME: garinkood_test
          DB_USER: garinkood
          DB_PASSWORD: garinkood
          DB_HOST: localhost
          DB_PORT: "5432"

      - name: Migrations apply and roll back cleanly on PostgreSQL
        run: |
          python manage.py migrate
          python manage.py migrate shop 0006
          python manage.py migrate
        env:
          DEBUG: "True"
          DB_ENGINE: postgresql
          DB_NAME: garinkood_test
          DB_USER: garinkood
          DB_PASSWORD: garinkood
          DB_HOST: localhost
          DB_PORT: "5432"

      - name: Seed commands are idempotent
        run: |
          python manage.py seed_locations
          python manage.py seed_locations
          python manage.py seed_agri_inputs
          python manage.py seed_agri_inputs
          python manage.py bootstrap_management_roles
        env:
          DEBUG: "True"
          DB_ENGINE: postgresql
          DB_NAME: garinkood_test
          DB_USER: garinkood
          DB_PASSWORD: garinkood
          DB_HOST: localhost
          DB_PORT: "5432"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-py${{ matrix.python-version }}
          path: garinkood/coverage.xml
          if-no-files-found: ignore

  security:
    name: Deployment checks and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garinkood/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Production deployment checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "False"
          # A 50+ character key so the deploy check exercises the real rule.
          SECRET_KEY: ci-only-a7Xq2LmZ9pR4tYw8Nc3Vb6Hj1Kd5Fg0SsUuEeIiOoPpQqWw
          ALLOWED_HOSTS: garinkood.ir
          SECURE_SSL_REDIRECT: "True"
          DB_ENGINE: sqlite
          DB_NAME: /tmp/garinkood-ci.sqlite3
          CACHE_URL: redis://127.0.0.1:6379/15
          OPERATIONS_TOKEN: ci-only-operations-token-not-used-outside-this-job

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true
