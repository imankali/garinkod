<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,700' rel='stylesheet' type='text/css'>


    <link rel="stylesheet" type="text/css" href="{% static 'css/navbar/css/style.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/navbar/css/bootstrap' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/search.css' %}">
</head>

<body>
	<section>
        <nav  class="navbar navbar-expand-lg ftco_navbar ftco-navbar-light" id="ftco-navbar">
		    <div class="container">
		    	<a class="navbar-brand" href="{% url 'shop:home' %}">GARINKOOD</a>
                    {% if request.user.is_authenticated %}
                        <a class="navbar-brand" href="{% url 'shop:profile' %}">{{ request.user.first_name }}</a>
                    {% else %}
                        <a class="navbar-brand" href="{% url 'shop:login' %}">login</a>
                    {% endif %}
		            <button class="navbar-toggler" type="button" data-toggle="collapse"
                            data-target="#ftco-nav" aria-controls="ftco-nav"
                            aria-expanded="false" aria-label="Toggle navigation">
		                <span class="fa fa-bars">  </span> Menu
                    </button>

		            <div class="collapse navbar-collapse" id="ftco-nav">
		                <ul class="navbar-nav ml-auto mr-md-3">
		        	        <li class="nav-item active"><a href="{% url 'shop:home' %}" class="nav-link">Home</a></li>
		        	        <li class="nav-item"><a href="#" class="nav-link">Accessories</a></li>
		        	        <li class="nav-item"><a href="{% url 'shop:Item' %}" class="nav-link">Products</a></li>
                            <li class="dropdown nav-item d-md-flex align-items-center justify-content-center">
                            <a href="#" class="dropdown-toggle nav-link
                            d-flex align-items-center justify-content-center icon-cart p-0"
                               id="dropdown04" data-toggle="dropdown" aria-expanded="false">
                                <i class="fa fa-shopping-cart"></i>
                                <b class="caret"></b>
                            </a>
                                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdown04">
                                    <a href="#" class="dropdown-item">Action</a>
                                    <a href="#" class="dropdown-item">Another action</a>
                                    <a href="#" class="dropdown-item">Something else here</a>
                                        <div class="dropdown-divider"></div>
                                            <a href="#" class="dropdown-item">Separated link</a>
                                        <div class="dropdown-divider"></div>
                                    <a href="#" class="dropdown-item">One more separated link</a>
                                </div>
                            </li>
		                </ul>
		            </div>
		        </div>
            <br>
        </nav>
    <!-- END nav -->


        <form method="post" action="{% url 'shop:search' %}" >
            {% csrf_token %}
            <div class="container justify-content-center" style="
                  direction: rtl; text-align: center; justify-content: center">
                <div class="row">
                    <div class="col-md-8">
                        <div class="input-group mb-3" style="padding-right: 5%">
                            <input type="text" name="text_input" style="direction: rtl;" value="{{ search_value }}"
                                   class="form-control input-text" placeholder="جستجو...">
                            <div class="input-group-append">
                                <input type="submit" name="search" value="serach" class="form-control input-text">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
	</section>
  <script src="{% static 'javascripts/navbar/js/jquery.min.js' %}"></script>
  <script src="{% static 'javascripts/navbar/js/popper.js' %}"></script>
  <script src="{% static 'javascripts/navbar/js/bootstrap.min.js' %}"></script>
  <script src="{% static 'javascripts/navbar/js/main.js' %}"></script>
</body>

</html>
