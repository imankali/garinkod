{% load static %}

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<style>
:root {
  --primary: #778873;
  --primary-light: #a1bc98;
  --bg: #f1f3e0;
  --text: #2d3748;
  --border: #d2dcb6;
  --shadow: rgba(0, 0, 0, 0.08);
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

.header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(241, 243, 224, 0.98);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 12px var(--shadow);
  font-family: 'Vazirmatn', sans-serif;
}

.header-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1rem;
  max-width: 1400px;
  margin: 0 auto;
  gap: 1rem;
}

/* Logo */
.logo {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  text-decoration: none;
  font-weight: 700;
  font-size: 1.3rem;
  color: var(--primary);
  white-space: nowrap;
}

.logo-icon {
  background: var(--primary);
  color: white;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* Search */
.search-wrapper {
  flex: 1;
  max-width: 600px;
  position: relative;
}

.search-form {
  display: flex;
  gap: 0.5rem;
  position: relative;
}

.search-input {
  flex: 1;
  padding: 0.6rem 1rem 0.6rem 2.8rem;
  border: 1px solid var(--border);
  border-radius: 50px;
  font-size: 0.95rem;
  transition: all 0.2s ease;
  background: white;
}

.search-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(119, 136, 115, 0.15);
}

.search-icon {
  position: absolute;
  left: 1.1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--primary);
}

.action-btn {
  background: var(--primary);
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: white;
  transition: background 0.2s;
  font-weight: bold;
}

.action-btn:hover {
  background: #667760;
}

.action-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Desktop Filters Panel */
.desktop-filters {
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  background: white;
  border-radius: 12px;
  box-shadow: 0 6px 20px var(--shadow);
  padding: 1.25rem;
  margin-top: 0.5rem;
  z-index: 10;
  display: none;
  animation: slideDown 0.2s ease;
}

.desktop-filters.active {
  display: block;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: end;
  margin-bottom: 1rem;
}

.filter-select,
.filter-input {
  padding: 0.65rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.9rem;
  min-width: 140px;
}

.filter-label {
  font-weight: 600;
  margin-bottom: 0.3rem;
  color: var(--text);
  font-size: 0.85rem;
  display: block;
}

.filter-group {
  flex: 1;
  min-width: 150px;
}

.filters-actions {
  display: flex;
  gap: 0.75rem;
  justify-content: flex-end;
  margin-top: 0.5rem;
}

/* Mobile Modal */
.filters-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: flex-end;
  z-index: 1100;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}

.filters-modal.active {
  opacity: 1;
  visibility: visible;
}

.filters-content {
  background: white;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 1.5rem;
  border-top-left-radius: 24px;
  border-top-right-radius: 24px;
  box-shadow: 0 -4px 24px var(--shadow);
  transform: translateY(100%);
  transition: transform 0.3s ease;
}

.filters-modal.active .filters-content {
  transform: translateY(0);
}

.filters-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.25rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}

.filters-title {
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--text);
}

.filters-close {
  background: none;
  border: none;
  font-size: 1.8rem;
  cursor: pointer;
  color: #888;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background 0.2s;
}

.filters-close:hover {
  background: #f0f0f0;
}

/* Nav & Icons */
.nav-links {
  display: none;
  gap: 1.5rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.nav-links a {
  text-decoration: none;
  color: var(--text);
  font-weight: 500;
  font-size: 0.95rem;
  position: relative;
  padding: 0.4rem 0;
}

.nav-links a:after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--primary);
  transition: width 0.3s ease;
}

.nav-links a:hover:after {
  width: 100%;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.icon-btn {
  background: none;
  border: none;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}

.icon-btn:hover {
  background: var(--primary-light);
  color: white;
}

.badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--primary);
  color: white;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  border: 2px solid white;
}

/* Mobile only */
.mobile-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.mobile-search-btn,
.mobile-menu-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  transition: background 0.2s;
}

.mobile-search-btn:hover,
.mobile-menu-btn:hover {
  background: var(--primary-light);
}

.mobile-search-btn svg,
.mobile-menu-btn svg {
  width: 24px;
  height: 24px;
}

/* Mobile Menu Sidebar */
.mobile-menu {
  position: fixed;
  top: 0;
  right: 0;
  width: 85%;
  max-width: 320px;
  height: 100vh;
  background: white;
  box-shadow: -4px 0 20px rgba(0,0,0,0.1);
  z-index: 1200;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  padding: 2rem 1.5rem;
  overflow-y: auto;
}

.mobile-menu.open {
  transform: translateX(0);
}

.mobile-menu-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1199;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s;
}

.mobile-menu-overlay.active {
  opacity: 1;
  visibility: visible;
}

.mobile-nav {
  list-style: none;
  padding: 0;
  margin: 2rem 0;
}

.mobile-nav li {
  margin: 1.2rem 0;
}

.mobile-nav a {
  text-decoration: none;
  color: var(--text);
  font-size: 1.3rem;
  font-weight: 600;
  display: block;
  padding: 0.75rem 0;
  border-bottom: 1px solid #eee;
}

.mobile-nav a:hover {
  color: var(--primary);
}

/* Responsive */
@media (min-width: 992px) {
  .mobile-actions { display: none; }
  .nav-links { display: flex; }
  .search-wrapper { max-width: 500px; }
  .mobile-modal-only { display: none !important; }
}

/* ✅ موبایل — هدر کوچک‌تر + بدون سبد خرید/پروفایل */
@media (max-width: 991px) {
  .desktop-search { display: none; }
  .desktop-filters { display: none !important; }

  .header-container {
    padding: 0.6rem 1rem;
    min-height: 60px;
  }

  .logo {
    font-size: 1.35rem;
    gap: 0.6rem;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
  }

  .mobile-actions {
    gap: 0.9rem;
  }

  .mobile-search-btn,
  .mobile-menu-btn {
    width: 48px !important;
    height: 48px !important;
  }

  .mobile-search-btn svg,
  .mobile-menu-btn svg {
    width: 22px;
    height: 22px;
  }

  .header {
    box-shadow: 0 2px 10px var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .mobile-hidden {
    display: none !important;
  }
}

@media (max-width: 768px) {
  .filter-select,
  .filter-input {
    width: 100% !important;
    min-width: auto !important;
    padding: 1rem !important;
    font-size: 1.1rem !important;
    height: 56px !important;
    border-radius: 12px !important;
  }

  .price-range {
    flex-direction: column;
    gap: 1rem !important;
  }

  .filter-label {
    font-size: 1.1rem !important;
    margin-bottom: 0.5rem !important;
  }

  .filters-content {
    padding: 1.75rem !important;
  }

  .apply-btn, .reset-btn {
    width: 100% !important;
    padding: 1.2rem !important;
    font-size: 1.2rem !important;
    margin-top: 1rem !important;
    border-radius: 12px !important;
  }

  .filters-actions {
    flex-direction: column;
  }

  .action-btn {
    width: 48px !important;
    height: 48px !important;
  }
}
</style>

<header class="header" role="banner">
  <div class="header-container">
    <a href="/" class="logo" aria-label="گرین کود - صفحه اصلی">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 20h10"></path>
          <path d="M10 20c5.5-2.5.8-6.4 3-10"></path>
          <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"></path>
          <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"></path>
        </svg>
      </div>

    </a>

    <div class="search-wrapper desktop-search">
      <form method="get" action="{% url 'shop:search' %}" class="search-form" id="desktop-search-form">
        <div style="position: relative; flex: 1;">

        <button type="button" id="toggle-desktop-filters" class="action-btn" title="فیلترها" aria-label="فیلترها" aria-expanded="false">

            <line x1="4" y1="8" x2="20" y2="8"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="16" x2="20" y2="16"></line>
          </svg>

        <button type="submit" class="action-btn" title="جستجو" aria-label="جستجو" id="desktop-search-submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>

        <div class="desktop-filters" id="desktop-filters-panel">
          <div class="filter-row">

                {% for cat in categories %}

                    {{ cat.name }}

            </div>

            <div class="filter-group">
              <label class="filter-label">قیمت از (تومان)</label>

            <div class="filter-group">
              <label class="filter-label">قیمت تا (تومان)</label>
              <input type="number" name="max_price" value="{{ max_price|default:'' }}" placeholder="مثلاً 500000" class="filter-input"

            </div>

    </div>

    <ul class="nav-links">
      <li><a href="/">خانه</a></li>
      <li><a href="#products-section">محصولات</a></li>
      <li><a href="#">درباره ما</a></li>
      <li><a href="#">تماس</a></li>
    </ul>

    <div class="header-actions mobile-hidden">
      {% if user.is_authenticated %}
        <a href="{% url 'shop:profile' %}" class="icon-btn" title="پروفایل" aria-label="پروفایل">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>

      <button class="icon-btn" onclick="toggleCart()" title="سبد خرید" aria-label="سبد خرید">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="8" cy="21" r="1"></circle>
          <circle cx="19" cy="21" r="1"></circle>
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
        </svg>
        <span class="badge" id="cart-badge" style="display: none;">0</span>
      </button>
    </div>

    <div class="mobile-actions">
      <button class="mobile-search-btn" id="mobile-search-open" aria-label="جستجو و فیلتر">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
      </button>
      <button class="mobile-menu-btn" id="mobile-menu-open" aria-label="منو">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>

  <div class="filters-content" id="filters-content">

</div>

</div>

<div class="mobile-menu-overlay" id="mobile-menu-overlay"></div>

<script>
/* (اسکریپت‌ها بدون تغییر — همان اسکریپت قبلی) */
document.addEventListener('DOMContentLoaded', function () {
  function setLoading(btn, isLoading) {
    if (isLoading) {
      btn.disabled = true;
      btn.textContent = 'در حال جستجو...';
    } else {
      btn.disabled = false;
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>';
    }
  }

  // Desktop Filters
  const toggleBtn = document.getElementById('toggle-desktop-filters');
  const filtersPanel = document.getElementById('desktop-filters-panel');
  const desktopForm = document.getElementById('desktop-search-form');
  const applyDesktop = document.getElementById('desktop-apply-filters');
  const resetDesktop = document.getElementById('desktop-reset-filters');
  const submitDesktop = document.getElementById('desktop-search-submit');

  let isDesktopOpen = false;

  function updateDesktopToggle() {
    const svg = toggleBtn.querySelector('svg');
    if (isDesktopOpen) {
      svg.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
      toggleBtn.setAttribute('aria-label', 'بستن فیلترها');
      toggleBtn.setAttribute('aria-expanded', 'true');
    } else {
      svg.innerHTML = '<line x1="4" y1="8" x2="20" y2="8"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="16" x2="20" y2="16"></line>';
      toggleBtn.setAttribute('aria-label', 'فیلترها');
      toggleBtn.setAttribute('aria-expanded', 'false');
    }
  }

  if (toggleBtn && filtersPanel) {
    toggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      isDesktopOpen = !isDesktopOpen;
      filtersPanel.style.display = isDesktopOpen ? 'block' : 'none';
      updateDesktopToggle();
    });

    document.addEventListener('click', function(e) {
      if (isDesktopOpen && !filtersPanel.contains(e.target) && e.target !== toggleBtn) {
        filtersPanel.style.display = 'none';
        isDesktopOpen = false;
        updateDesktopToggle();
      }
    });

    if (applyDesktop) applyDesktop.addEventListener('click', () => desktopForm.submit());
    if (resetDesktop) resetDesktop.addEventListener('click', () => {
      filtersPanel.querySelectorAll('input, select').forEach(el => el.value = '');
    });
    if (submitDesktop) {
      desktopForm.addEventListener('submit', e => {
        e.preventDefault();
        setLoading(submitDesktop, true);
        setTimeout(() => desktopForm.submit(), 300);
      });
    }
  }

  // Mobile Search Modal
  const mobileOpen = document.getElementById('mobile-search-open');
  const modal = document.getElementById('search-modal');
  const closeBtn = document.getElementById('search-modal-close');
  const mobileForm = document.getElementById('mobile-search-form');
  const mobileSubmit = document.getElementById('mobile-search-submit');

  function trapFocus(el) {
    const focusable = el.querySelectorAll('button, [href], input, select, [tabindex]:not([tabindex="-1"])');
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    el.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault(); first.focus();
        }
      }
    });
    first.focus();
  }

  function closeModal() {
    modal.classList.remove('active');
    document.body.style.overflow = '';
    document.querySelector('.mobile-search-btn').focus();
  }

  function openModal() {
    closeMobileMenu();
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    trapFocus(document.getElementById('filters-content'));
  }

  if (mobileOpen) mobileOpen.addEventListener('click', openModal);
  if (closeBtn) closeBtn.addEventListener('click', closeModal);
  if (modal) modal.addEventListener('click', e => e.target === modal && closeModal());
  document.addEventListener('keydown', e => e.key === 'Escape' && modal.classList.contains('active') && closeModal());

  const mobileInputs = modal.querySelectorAll('.filter-input, .filter-select');
  mobileInputs.forEach(input => input.addEventListener('keypress', e => e.key === 'Enter' && (e.preventDefault(), mobileForm.submit())));

  if (mobileSubmit) {
    mobileForm.addEventListener('submit', e => {
      e.preventDefault();
      mobileSubmit.disabled = true;
      mobileSubmit.textContent = 'در حال جستجو...';
      setTimeout(() => mobileForm.submit(), 300);
    });
  }

  if (document.getElementById('mobile-reset-filters')) {
    document.getElementById('mobile-reset-filters').addEventListener('click', () => {
      mobileForm.querySelectorAll('input, select').forEach(el => el.value = '');
    });
  }

  // Mobile Menu
  const menuOpenBtn = document.getElementById('mobile-menu-open');
  const menuCloseBtn = document.getElementById('mobile-menu-close');
  const mobileMenu = document.getElementById('mobile-menu');
  const menuOverlay = document.getElementById('mobile-menu-overlay');

  function closeMobileMenu() {
    mobileMenu.classList.remove('open');
    menuOverlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  function openMobileMenu() {
    closeModal();
    mobileMenu.classList.add('open');
    menuOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  if (menuOpenBtn) menuOpenBtn.addEventListener('click', openMobileMenu);
  if (menuCloseBtn) menuCloseBtn.addEventListener('click', closeMobileMenu);
  if (menuOverlay) menuOverlay.addEventListener('click', closeMobileMenu);
  document.addEventListener('keydown', e => e.key === 'Escape' && mobileMenu.classList.contains('open') && closeMobileMenu());
});
</script>
