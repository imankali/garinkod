<header class="header" role="banner">
        <div class="header-container">
            <a href="/" class="logo" aria-label="گرین کود - صفحه اصلی">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M7 20h10"></path>
                        <path d="M10 20c5.5-2.5.8-6.4 3-10"></path>
                        <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"></path>
                        <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"></path>
                    </svg>
                </div>
                گرین کود
            </a>
            <div class="search-wrapper desktop-search">
                <form method="get" action="{% url 'shop:search' %}" class="search-form" id="desktop-search-form">
                    <div style="position: relative; flex: 1;">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <input type="text" name="text_input" value="{{ search_value|default:'' }}" placeholder="جستجوی محصول..." class="search-input">
                    </div>
                    <button type="button" id="toggle-desktop-filters" class="action-btn" title="فیلترها" aria-label="فیلترها" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="4" y1="8" x2="20" y2="8"></line>
                            <line x1="4" y1="12" x2="20" y2="12"></line>
                            <line x1="4" y1="16" x2="20" y2="16"></line>
                        </svg>
                    </button>
                    <button type="submit" class="action-btn" title="جستجو" aria-label="جستجو" id="desktop-search-submit">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                    <div class="desktop-filters" id="desktop-filters-panel">
                        <div class="filter-row">
                            <div class="filter-group">
                                <label class="filter-label">دسته‌بندی</label>
                                <select name="category" class="filter-select">
                                    <option value="">همه دسته‌ها</option>
                                    {% for cat in categories %}
                                        <option value="{{ cat.slug }}" {% if cat.slug == selected_category_slug %}selected{% endif %}>
                                            {{ cat.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="filter-group">
                                <label class="filter-label">قیمت از (تومان)</label>
                                <input type="number" name="min_price" value="{{ min_price|default:'' }}" placeholder="مثلاً 10000" class="filter-input" inputmode="numeric" autocomplete="off">
                            </div>
                            <div class="filter-group">
                                <label class="filter-label">قیمت تا (تومان)</label>
                                <input type="number" name="max_price" value="{{ max_price|default:'' }}" placeholder="مثلاً 500000" class="filter-input" inputmode="numeric" autocomplete="off">
                            </div>
                        </div>
                        <div class="filters-actions">
                            <button type="button" class="action-btn reset-btn" style="background: #e0e0e0; color: var(--text);" id="desktop-reset-filters">
                                بازنشانی
                            </button>
                            <button type="button" class="action-btn apply-btn" id="desktop-apply-filters">
                                اعمال فیلتر
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <ul class="nav-links">
                <li><a href="/">خانه</a></li>
                <li><a href="/">محصولات</a></li>
                <li><a href="#">درباره ما</a></li>
                <li><a href="#">تماس</a></li>
            </ul>
            <div class="header-actions mobile-hidden">
                {% if user.is_authenticated %}
                    <a href="{% url 'shop:profile' %}" class="icon-btn" title="پروفایل" aria-label="پروفایل">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>
                {% else %}
                    <a href="{% url 'shop:user_login' %}" class="icon-btn" title="ورود" aria-label="ورود">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>
                {% endif %}
                <button class="icon-btn cart-icon-btn" title="سبد خرید" aria-label="سبد خرید">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="8" cy="21" r="1"></circle>
                        <circle cx="19" cy="21" r="1"></circle>
                        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
                    </svg>
                    <span class="badge" id="cart-badge" style="display: none;">0</span>
                </button>
            </div>
            <div class="mobile-actions">
                <button class="mobile-search-btn" id="mobile-search-open" aria-label="جستجو و فیلتر">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <button class="mobile-menu-btn" id="mobile-menu-open" aria-label="منو">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>
        <!-- Mobile Search Modal -->
        <div class="filters-modal" id="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-modal-title" tabindex="-1">
            <div class="filters-content" id="filters-content">
                <div class="filters-header">
                    <h2 class="filters-title" id="search-modal-title">جستجو و فیلتر</h2>
                    <button class="filters-close" id="search-modal-close" aria-label="بستن">&times;</button>
                </div>
                <form method="get" action="{% url 'shop:search' %}" class="mobile-modal-only" id="mobile-search-form">
                    <div class="filter-group">
                        <label class="filter-label">عبارت جستجو</label>
                        <input type="text" name="text_input" value="{{ search_value|default:'' }}" placeholder="نام محصول..." class="filter-input">
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">دسته‌بندی</label>
                        <select name="category" class="filter-select">
                            <option value="">همه دسته‌ها</option>
                            {% for cat in categories %}
                                <option value="{{ cat.slug }}" {% if cat.slug == selected_category_slug %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">محدوده قیمت (تومان)</label>
                        <div class="price-range" style="display: flex; gap: 1rem;">
                            <div style="flex: 1;">
                                <input type="number" name="min_price" value="{{ min_price|default:'' }}" placeholder="از (تومان)" class="filter-input" inputmode="numeric" autocomplete="off">
                            </div>
                            <div style="flex: 1;">
                                <input type="number" name="max_price" value="{{ max_price|default:'' }}" placeholder="تا (تومان)" class="filter-input" inputmode="numeric" autocomplete="off">
                            </div>
                        </div>
                    </div>
                    <div class="filters-actions">
                        <button type="button" class="action-btn reset-btn" style="background: #e0e0e0; color: var(--text); margin-top: 1rem;" id="mobile-reset-filters">
                            بازنشانی
                        </button>
                        <button type="submit" class="action-btn apply-btn" style="margin-top: 1rem;" id="mobile-search-submit">
                            اعمال فیلتر
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <!-- Mobile Menu Sidebar -->
        <div class="mobile-menu" id="mobile-menu">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <span class="logo" style="font-size: 1.4rem; color: var(--primary); font-weight: 700;">گرین کود</span>
                <button id="mobile-menu-close" class="filters-close" style="margin: 0;" aria-label="بستن منو">×</button>
            </div>
            <ul class="mobile-nav">
                <li><a href="/">خانه</a></li>
                <li><a href="#products-section">محصولات</a></li>
                <li><a href="#">درباره ما</a></li>
                <li><a href="#">تماس</a></li>
            </ul>
        </div>
        <div class="mobile-menu-overlay" id="mobile-menu-overlay"></div>

        <!-- Cart Sidebar -->
        <div class="cart-overlay" id="cart-overlay"></div>
        <div class="cart-sidebar" id="cart-sidebar">
            <div class="cart-header">
                <h2>سبد خرید</h2>
                <button class="cart-close-btn" aria-label="بستن سبد خرید">&times;</button>
            </div>
            <div class="cart-items" id="cart-items">
                <!-- Cart items will be injected here by JavaScript -->
            </div>
            <div class="cart-footer" id="cart-footer">
                <div class="cart-total">
                    <span>جمع کل:</span>
                    <span id="cart-total-price">0 تومان</span>
                </div>
                <a href="{% url 'shop:cart_detail' %}" class="checkout-btn">مشاهده سبد خرید</a>
            </div>
        </div>
