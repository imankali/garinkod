{% load static %}
{% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'css/search.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/header.css' %}">
{% endblock %}
<!-- بنر اصلی / هدر -->
<div class="header-container">
    <a href="/" class="logo">🌱 GARINKOD</a>
        <nav class="main-nav">
            <ul>
                <li><a href="/">خانه</a></li>
                <li><a href="/shop/">فروشگاه</a></li>
                <li><a href="/tutorials/">آموزش‌ها</a></li>
                <li><a href="/contact/">تماس</a></li>
            </ul>
        </nav>
    <!-- فرم جستجو و فیلتر -->
        <div class="search-box">
            <form method="get" action="{% if category_slug %}{% url 'shop:search_in_category' category_slug %}{% else %}{% url 'shop:search' %}{% endif %}">
                <!-- جستجوی اصلی -->
                <div class="search-main">
                    <input type="text"
                           name="text_input"
                           value="{{ search_value|default:'' }}"
                           placeholder="جستجوی محصول...">
                    <button type="submit" class="search-icon-btn" title="جستجو">
                        🔍
                    </button>
                    <button type="button" id="toggle-filters" class="filter-toggle-btn" title="فیلترها">
                        ⚙️
                    </button>
                </div>
                <!-- فیلترها (به‌صورت پیش‌فرض پنهان) -->
                <div id="filters-section" class="filters-section hidden">
                    <div class="filter-row">
                        <select name="category" class="filter-select">
                            <option value="">همه دسته‌ها</option>
                            {% for cat in categories %}
                                <option value="{{ cat.slug }}" {% if cat.slug == selected_category_slug %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>

                        <input type="number" name="min_price" value="{{ min_price|default:'' }}" placeholder="قیمت از">
                        <span class="filter-separator">—</span>
                        <input type="number" name="max_price" value="{{ max_price|default:'' }}" placeholder="قیمت تا">

                        <button type="submit" class="apply-filter-btn">اعمال فیلتر</button>
                    </div>
                </div>
            </form>
            <div id="suggestions" class="suggestions-dropdown"></div>
        </div>
    {% if user.is_authenticated %}
        <a href="{% url 'shop:profile' %}">
            <i class="fas fa-user-circle"></i>
            <br>
            {{ user.username }}
        </a>
    {% else %}
        <a href="{% url 'shop:user_login' %}">
            <i class="fas fa-right-to-bracket"></i> ورود
        </a>
    {% endif %}
</div>
