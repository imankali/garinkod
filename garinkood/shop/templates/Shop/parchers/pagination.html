<!-- صفحه‌بندی هوشمند -->
{% if product.has_other_pages %}
<div class="pagination">
    <span class="step-links">
        {% if product.has_previous %}
            <a href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value }}&{% endif %}{% endfor %}page=1">
                &laquo; اولین
            </a>
            <a href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value }}&{% endif %}{% endfor %}page={{ product.previous_page_number }}">
                قبلی
            </a>
        {% endif %}

        <span class="current">
            صفحه {{ product.number }} از {{ product.paginator.num_pages }}.
        </span>

        {% if product.has_next %}
            <a href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value }}&{% endif %}{% endfor %}page={{ product.next_page_number }}">
                بعدی
            </a>
            <a href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key }}={{ value }}&{% endif %}{% endfor %}page={{ product.paginator.num_pages }}">
                آخرین &raquo;
            </a>
        {% endif %}
    </span>
</div>
{% endif %}
